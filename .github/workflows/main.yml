name: Build AgriCoach APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extraire le projet
        run: |
          ZIP=$(find . -type f -iname ".zip" -not -path "./.git/" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP introuvable"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          PACKAGE=$(find extracted -type d -name node_modules -prune -o -type f -name package.json -print | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json introuvable"
            exit 1
          fi

          echo "APP_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurer Android
        uses: android-actions/setup-android@v3

      - name: Installer les dependances
        run: |
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps

      - name: Construire le projet
        run: |
          cd "$APP_DIR"
          npm run build
          test -f dist/index.html

      - name: Creer la version Android
        run: |
          cd "$APP_DIR"

          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.agricoach.app",
            "appName": "AgriCoach",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Comfigurer android
        run: |
    # Commandes de configuration Android 
       
      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriCoach-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
